# Picked up automatically when ansible-playbook runs from this directory,
# so `ansible-playbook deploy.yml` works without repeating -i every time.
[defaults]
inventory = inventory.ini
# The cowsay banner and per-task deprecation noise add nothing here.
nocows = True
deprecation_warnings = False
# Show which tasks actually changed something, in a readable layout.
stdout_callback = yaml
# Auto-detects Python on the target (a stock Ubuntu box works fine) without
# printing the interpreter-discovery warning every run.
interpreter_python = auto_silent
