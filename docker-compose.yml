# Pieceocraft — a Minecraft Bedrock Dedicated Server, reachable over Tailscale.
#
# One service, one image: itzg/minecraft-bedrock-server
# (github.com/itzg/docker-minecraft-bedrock-server) — it downloads and runs
# Mojang's own Bedrock Dedicated Server binary, this is not a reimplementation.
#
# The wrapper image itself is pinned to an exact tag below, so an unrelated
# `docker compose pull` can't change how the container boots. The Bedrock
# binary INSIDE it is a DIFFERENT, EXPLICIT pin (MC_VERSION below) rather
# than VERSION=LATEST — confirmed by hand that the latest build available as
# of 2026-09-16 (1.26.45.1.1) is flat-out broken on Linux: it logs "Accepting
# clients on [::]:19132" and "Server started." but never actually binds a
# working socket (checked the kernel's own UDP socket table inside the
# container — no listener on 19132 in either protocol family, reproduced
# identically under both Docker's bridge network and --network host, so
# it's the binary itself, not anything about this compose file). 1.26.45.1
# is the last version confirmed to bind correctly, and not coincidentally —
# Bedrock's client/server protocol is version-sensitive, so it's worth
# matching whatever your own client is on anyway (check a connecting
# device's Minecraft settings, or the "Version:" line in a failed-connection
# error screen).
#
# Bumping this later: only do it after checking a fresh LATEST actually
# binds (`docker run --rm -e EULA=TRUE -e VERSION=LATEST -p 29132:19132/udp
# itzg/minecraft-bedrock-server:<tag>`, then look for "IPv4 supported, port:
# 19132" in its logs — that line's presence is what separates a working boot
# from this exact silent failure) — Mojang ships Bedrock updates often
# enough that this WILL need bumping eventually for client compatibility.
#
# Every other setting below reads from .env, which ansible/deploy.yml
# generates from vars.yml — see that file's own header for why. Run this
# directly with plain `docker compose up -d` (no Ansible, no .env) and it
# still comes up fine, just with the defaults baked into this file.
name: pieceocraft

services:
  bedrock:
    image: itzg/minecraft-bedrock-server:2026.8.2
    container_name: pieceocraft-bedrock
    environment:
      EULA: "TRUE"
      VERSION: ${MC_VERSION:-1.26.45.1}
      # Heads-up line on the console, then a clean `stop` this many seconds
      # later, on `docker compose stop` — without it a slow save can get cut
      # off by Docker's own kill timeout instead of finishing.
      STOP_SERVER_ANNOUNCE_DELAY: "10"
      # Makes the binary actually bind both an IPv4 and an IPv6 socket
      # instead of the single dual-stack one it tries by default (see the
      # MC_VERSION comment above — this alone did NOT fix 1.26.45.1.1's
      # breakage, but it's a real, needed fix in general and costs nothing
      # to leave on).
      ENABLE_BDS_V6BIND_FIX: "true"
      SERVER_NAME: ${SERVER_NAME:-Pieceocraft}
      LEVEL_NAME: ${LEVEL_NAME:-PieceocraftWorld}
      LEVEL_SEED: ${LEVEL_SEED:-}
      GAMEMODE: ${GAMEMODE:-survival}
      DIFFICULTY: ${DIFFICULTY:-easy}
      ALLOW_CHEATS: ${ALLOW_CHEATS:-false}
      MAX_PLAYERS: ${MAX_PLAYERS:-10}
      ONLINE_MODE: ${ONLINE_MODE:-true}
      VIEW_DISTANCE: ${VIEW_DISTANCE:-16}
      ALLOW_LIST: ${ALLOW_LIST:-false}
      ALLOW_LIST_USERS: ${ALLOW_LIST_USERS:-}
      OPS: ${OPS:-}
      SERVER_PORT: ${SERVER_PORT:-19132}
      SERVER_PORT_V6: ${SERVER_PORT_V6:-19133}
      TZ: ${TZ:-Asia/Almaty}
    ports:
      - "${SERVER_PORT:-19132}:19132/udp"
      - "${SERVER_PORT_V6:-19133}:19133/udp"
    volumes:
      - ./data:/data
    # The wrapper's entrypoint reads the console over stdin (needed to send
    # `stop` for a clean save on `docker compose stop`, and for `make
    # console` / `docker attach`) — without these two, a stop has to fall
    # back to a hard kill after its timeout instead of a graceful save.
    stdin_open: true
    tty: true
    # send-command (what `make cmd` uses) locates the running bedrock_server
    # process by reading /proc/*/exe, which needs SYS_PTRACE — without it,
    # every `make cmd` fails with "Permission denied" / "failed to search
    # for bedrock server process" on a host with restricted ptrace_scope
    # (the Linux default on many distros, confirmed on this one).
    cap_add:
      - SYS_PTRACE
    restart: unless-stopped
